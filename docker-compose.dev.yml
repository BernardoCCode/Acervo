services:
  postgres:
    image: postgres:17-alpine
    container_name: psiartigos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-psiartigos}
      POSTGRES_USER: ${POSTGRES_USER:-psiartigos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-psiartigos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - psiartigos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: psiartigos-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  psiartigos_pgdata:
